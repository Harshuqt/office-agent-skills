[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-agent-skills"
version = "0.1.0"
description = "Cross-platform office document skills and utilities for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pandas>=2.0",
  "pypdf>=4.0",
  "pdfplumber>=0.10",
  "reportlab>=4.0",
  "matplotlib>=3.7",
  "weasyprint>=60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
